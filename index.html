<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SeeYouYou — Talk to anyone, anywhere.</title>
<meta name="description" content="Real-time voice translation for in-person conversation. 86 languages. Built for two people sharing one phone, face-to-face. Made by AvAmeliA in Denmark."/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

<link rel="stylesheet" href="tokens.css?v=s59"/>
<link rel="stylesheet" href="styles.css?v=s59"/>

<style>
  /* preloader cover */
  body.loading .app-root { opacity: 0; }
  .app-root { opacity: 1; transition: opacity .6s var(--ease-decel); }
  .preloader {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(ellipse at center, #0a1130 0%, #02050f 80%);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 18px;
    color: #E0D4FC; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    transition: opacity .5s var(--ease-decel);
  }
  body:not(.loading) .preloader { opacity: 0; pointer-events: none; }
  .pre-mark {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 2px solid rgba(167, 139, 250, 0.25);
    border-top-color: #A78BFA;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pre-text { font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; }
</style>
</head>
<body class="loading">

<canvas id="bg-canvas" aria-hidden="true"></canvas>

<div class="preloader" aria-hidden="true">
  <div class="pre-mark"></div>
  <div class="pre-text">Loading SeeYouYou</div>
</div>

<div id="root" class="app-root"></div>

<!-- React + Babel (pinned) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Background frame loader (vanilla) -->
<script src="scroll-bg.js?v=s59"></script>

<!-- App components -->
<script type="text/babel" src="app-core.jsx?v=s59"></script>
<script type="text/babel" src="app-sections.jsx?v=s59"></script>
<script type="text/babel" src="privacy-modal.jsx?v=s59"></script>
<script type="text/babel" src="terms-modal.jsx?v=s59"></script>

<script type="text/babel">
  const { useState, useEffect } = React;

  function App() {
    const [scrollProgress, setScrollProgress] = useState(0);
    const [privacyOpen, setPrivacyOpen] = useState(false);
    const [termsOpen, setTermsOpen] = useState(false);

    useEffect(() => {
      let raf = null;
      function update() {
        raf = null;
        const max = document.documentElement.scrollHeight - window.innerHeight;
        const p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
        setScrollProgress(p);
      }
      function onScroll() { if (raf == null) raf = requestAnimationFrame(update); }
      update();
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll);
      return () => {
        window.removeEventListener('scroll', onScroll);
        window.removeEventListener('resize', onScroll);
      };
    }, []);

    // Global delegation: any element with data-action="privacy" or "terms" opens the matching modal.
    useEffect(() => {
      function onClick(e) {
        const privacyEl = e.target.closest('[data-action="privacy"]');
        if (privacyEl) {
          e.preventDefault();
          setPrivacyOpen(true);
          return;
        }
        const termsEl = e.target.closest('[data-action="terms"]');
        if (termsEl) {
          e.preventDefault();
          setTermsOpen(true);
        }
      }
      document.addEventListener('click', onClick);
      return () => document.removeEventListener('click', onClick);
    }, []);

    return (
      <>
        <PillNav />
        <Hero scrollProgress={scrollProgress} />
        <TrustStrip />
        <ProblemSection />
        <HowItWorks />
        <FeaturesSection />
        <PricingSection />
        <PrivacySection />
        <FAQSection />
        <EmailSection />
        <Footer />
        <PrivacyModal open={privacyOpen} onClose={() => setPrivacyOpen(false)} />
        <TermsModal open={termsOpen} onClose={() => setTermsOpen(false)} />
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
