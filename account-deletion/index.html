<script type="text/babel">
  function AccountDeletionPage() {
    return (
      <div className="policy-page">
        <div className="policy-topbar">
          <a href="../" className="policy-back" aria-label="Back to SeeYouYou homepage">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M15 18l-6-6 6-6"/>
            </svg>
            <span>Back to SeeYouYou</span>
          </a>
          <span className="policy-brand">
            <span className="policy-brand-dot"></span>
            SeeYouYou
          </span>
        </div>

        <article className="policy-card">
          <header className="privacy-modal-head">
            <div className="privacy-modal-titlewrap">
              <div className="privacy-modal-eyebrow">
                <span className="pm-dot"/>
                <span>Account deletion</span>
              </div>
              <h1 className="privacy-modal-title">Account deletion for SeeYouYou</h1>
              <p className="privacy-modal-meta">
                Operated by AvAmeliA (CVR: 44612194), Denmark
              </p>
            </div>
          </header>

          <div className="privacy-modal-body">

            <p className="privacy-intro">
              SeeYouYou is operated by AvAmeliA (CVR: 44612194), Denmark. This page describes how you can delete your SeeYouYou account and the data associated with it.
            </p>

            <section className="privacy-section">
              <h2 className="privacy-section-title"><span>How to delete your account</span></h2>
              <p>Two ways, both available at any time:</p>

              <p style={{ marginTop: '14px' }}>
                <strong>1. In the app (fastest):</strong><br/>
                Open SeeYouYou → Profile → "Delete account" → confirm.
              </p>

              <p style={{ marginTop: '14px' }}>
                <strong>2. By email:</strong><br/>
                Send an email to <a href="mailto:support@seeyouyou.app?subject=Account%20Deletion%20Request" style={{ color: 'var(--brand-violet-deep)', fontWeight: 600 }}>support@seeyouyou.app</a> with the subject line "Account Deletion Request." Include the email address associated with your account. We process deletion requests within 30 days.
              </p>
            </section>

            <section className="privacy-section">
              <h2 className="privacy-section-title"><span>What gets deleted</span></h2>
              <p>When your account is deleted, we remove:</p>
              <ul style={{ margin: '8px 0 0 18px', padding: 0, lineHeight: 1.7 }}>
                <li>Your account record (email address, display name, user ID)</li>
                <li>Your credit balance (any remaining free, pack, or subscription credits)</li>
                <li>Your acceptance records (Privacy Policy / Terms of Service version log)</li>
                <li>Your locally stored device data (cleared when you sign out or uninstall the app)</li>
              </ul>
              <p style={{ marginTop: '14px' }}>
                We do not store conversation transcripts or voice audio on our servers, so there is no conversation history to delete.
              </p>
            </section>

            <section className="privacy-section">
              <h2 className="privacy-section-title"><span>What we retain (and why)</span></h2>
              <p>Some data is retained where Danish law requires it:</p>
              <ul style={{ margin: '8px 0 0 18px', padding: 0, lineHeight: 1.7 }}>
                <li><strong>Purchase records</strong> (transaction ID, amount, date, product purchased): retained for 5 years per Danish bookkeeping law (<em>bogføringsloven</em>). This is anonymized from your personal account after deletion — the records remain in our accounting books without your name or email attached.</li>
                <li><strong>Audit log entries</strong> related to refunds or disputes: retained while the dispute is open, then anonymized.</li>
              </ul>
            </section>

            <section className="privacy-section">
              <h2 className="privacy-section-title"><span>Timing</span></h2>
              <p>
                We complete account deletion within 30 days of your request. Most deletions complete within 7 days.
              </p>
            </section>

            <section className="privacy-section">
              <h2 className="privacy-section-title"><span>Questions</span></h2>
              <p>
                Email <a href="mailto:support@seeyouyou.app?subject=Account%20Deletion%20Question" style={{ color: 'var(--brand-violet-deep)', fontWeight: 600 }}>support@seeyouyou.app</a> with the subject line "Account Deletion Question."
              </p>
            </section>

            <hr style={{ border: 0, borderTop: '1px dashed rgba(15, 20, 50, 0.18)', margin: '8px 0 18px' }}/>

            <p style={{ fontSize: '13px', color: 'var(--text-secondary)', lineHeight: 1.6 }}>
              This page describes account deletion for the SeeYouYou Android app. For our full privacy policy, see <a href="../privacy/" style={{ color: 'var(--brand-violet-deep)', fontWeight: 600 }}>/privacy/</a>. For our terms of service, see <a href="../terms/" style={{ color: 'var(--brand-violet-deep)', fontWeight: 600 }}>/terms/</a>.
            </p>

          </div>
        </article>
      </div>

  ReactDOM.createRoot(document.getElementById('root')).render(<AccountDeletionPage />);
</script>
