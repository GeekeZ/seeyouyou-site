<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Account deletion — SeeYouYou</title>
<meta name="description" content="How to delete your SeeYouYou account, what gets removed, what is retained for accounting law, and how long it takes."/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

<link rel="stylesheet" href="../tokens.css?v=s62"/>
<link rel="stylesheet" href="../styles.css?v=s62"/>

<style>
  /* Standalone-page background — mirrors the homepage atmosphere. */
  html, body {
    background: radial-gradient(ellipse at top, #0a1130 0%, #02050f 70%);
    min-height: 100%;
    color: #E0D4FC;
  }
  body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 20% 10%, rgba(124, 58, 237, 0.22), transparent 55%),
      radial-gradient(circle at 80% 90%, rgba(59, 130, 246, 0.18), transparent 55%);
    z-index: 1;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="root"></div>

<!-- React + Babel (pinned) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
  function AccountDeletionPage() {
    return (
      <div className="policy-page">
        <div className="policy-topbar">
          <a href="../" className="policy-back" aria-label="Back to SeeYouYou homepage">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M15 18l-6-6 6-6"/>
            </svg>
            <span>Back to SeeYouYou</span>
          </a>
          <span className="policy-brand">
            <span className="policy-brand-dot"></span>
            SeeYouYou
          </span>
        </div>

        <article className="policy-card">
          <header className="privacy-modal-head">
            <div className="privacy-modal-titlewrap">
              <div className="privacy-modal-eyebrow">
                <span className="pm-dot"/>
                <span>Account deletion</span>
              </div>
              <h1 className="privacy-modal-title">Account deletion</h1>
              <p className="privacy-modal-meta">
                Controller: AvAmeliA (sole proprietor), Denmark — CVR: 44612194 · Contact: support@seeyouyou.app
              </p>
            </div>
          </header>

          <div className="privacy-modal-body">

            <p className="privacy-intro">
              You can delete your SeeYouYou account at any time. This page explains exactly how to request deletion, what is removed, what is kept (and why), and how long the process takes.
            </p>

            <section className="privacy-section">
              <h2 className="privacy-section-title"><span>1.</span> How to delete your account</h2>

              <h3 style={{ fontSize: '15px', fontWeight: 700, margin: '14px 0 6px', color: 'var(--text-primary-navy)' }}>From inside the app (recommended)</h3>
              <ol style={{ margin: '0 0 14px 18px', padding: 0, lineHeight: 1.7 }}>
                <li>Open the SeeYouYou app on your Android device.</li>
                <li>Go to the <strong>Profile</strong> screen.</li>
                <li>Tap <strong>Delete account</strong>.</li>
                <li>Confirm the request when prompted.</li>
              </ol>
              <p>Your request is recorded immediately and processed within <strong>30 days</strong>.</p>

              <h3 style={{ fontSize: '15px', fontWeight: 700, margin: '18px 0 6px', color: 'var(--text-primary-navy)' }}>By email (if you no longer have the app installed)</h3>
              <p>
                Email <a href="mailto:support@seeyouyou.app?subject=Account%20deletion%20request" style={{ color: 'var(--brand-violet-deep)', fontWeight: 600 }}>support@seeyouyou.app</a> from the email address tied to your account, with the subject line <em>"Account deletion request"</em>. Include your account email if you're writing from a different address. We will verify your identity and process the request within 30 days.
              </p>
            </section>

            <section className="privacy-section">
              <h2 className="privacy-section-title"><span>2.</span> What gets deleted</h2>
              <p>When your deletion request is processed, we remove the following from our systems:</p>
              <ul style={{ margin: '8px 0 0 18px', padding: 0, lineHeight: 1.7 }}>
                <li>Your account record (UID, email, sign-in method, display name).</li>
                <li>Your session metadata — start/end times, language pairs used, credit consumption, end reason.</li>
                <li>Your credit balance and all balance-change history.</li>
                <li>Your acceptance records (which versions of the Privacy Policy and Terms you accepted, and when). Note: these are stored on your device in app preferences; clearing app data or uninstalling the app also removes them locally.</li>
                <li>The deletion-request audit document itself — once your account is processed, the pending-request record is removed alongside everything else.</li>
              </ul>
              <p style={{ marginTop: '14px' }}>
                Voice audio and translated text were never stored on our servers in the first place — they are processed in real time and discarded — so there is nothing further to delete on that front.
              </p>
            </section>

            <section className="privacy-section">
              <h2 className="privacy-section-title"><span>3.</span> What is retained, and why</h2>
              <p>
                Some records are kept after account deletion because Danish law requires it. Specifically:
              </p>
              <ul style={{ margin: '8px 0 0 18px', padding: 0, lineHeight: 1.7 }}>
                <li><strong>Purchase records</strong> (transaction tokens, product IDs, timestamps) — retained for <strong>7 years</strong> from the transaction date, as required by the Danish Bookkeeping Act (<em>Bogføringsloven §10</em>).</li>
                <li><strong>Billing audit log</strong> (credit grants, deductions, expirations) — retained for <strong>7 years</strong> from the event, on the same legal basis.</li>
                <li><strong>Support correspondence</strong> tied to your account — typically up to 24 months; longer where law requires.</li>
              </ul>
              <p style={{ marginTop: '14px' }}>
                These retained records are no longer linked to an active account. They sit in our books to satisfy accounting and audit obligations, are not used for any other purpose, and are deleted automatically once the legal retention period ends.
              </p>
            </section>

            <section className="privacy-section">
              <h2 className="privacy-section-title"><span>4.</span> Timeline</h2>
              <ul style={{ margin: '8px 0 0 18px', padding: 0, lineHeight: 1.7 }}>
                <li><strong>Day 0</strong> — You submit the deletion request (in-app or by email). The request is recorded as <em>pending</em>.</li>
                <li><strong>Within 30 days</strong> — Your account and all associated operational data is deleted. You will lose access to the app's account-tied features (your credit balance, your usage history). Any remaining credits are forfeited at deletion.</li>
                <li><strong>Up to 7 years</strong> — Purchase records and the billing audit log remain in our books per Danish accounting law, then are deleted automatically.</li>
              </ul>
            </section>

            <section className="privacy-section">
              <h2 className="privacy-section-title"><span>5.</span> Cancelling a pending request</h2>
              <p>
                Changed your mind? If your deletion request is still <em>pending</em> (i.e., the 30-day processing window hasn't completed), you can cancel it. Email <a href="mailto:support@seeyouyou.app?subject=Cancel%20account%20deletion" style={{ color: 'var(--brand-violet-deep)', fontWeight: 600 }}>support@seeyouyou.app</a> from your account address with the subject line <em>"Cancel account deletion"</em>. Once the deletion has been processed, it cannot be undone — the data is gone.
              </p>
            </section>

            <section className="privacy-section">
              <h2 className="privacy-section-title"><span>6.</span> A note on Google sign-in</h2>
              <p>
                If you sign in with Google, deleting your SeeYouYou account does not delete your Google account, and it does not revoke SeeYouYou's permission to read your basic Google profile fields on a future sign-in. To revoke SeeYouYou's access to your Google account entirely, visit your Google Account at <a href="https://myaccount.google.com/permissions" target="_blank" rel="noopener noreferrer" style={{ color: 'var(--brand-violet-deep)', fontWeight: 600 }}>myaccount.google.com/permissions</a> and remove SeeYouYou from the list of connected apps.
              </p>
            </section>

            <section className="privacy-section">
              <h2 className="privacy-section-title"><span>7.</span> Your broader privacy rights</h2>
              <p>
                Account deletion is one of several rights you have under GDPR. You can also request a copy of your data, correct it, or restrict its processing. See the full list of rights and how to exercise them in the <a href="../privacy/" style={{ color: 'var(--brand-violet-deep)', fontWeight: 600 }}>Privacy Policy</a> (§7).
              </p>
            </section>

            <section className="privacy-section">
              <h2 className="privacy-section-title"><span>8.</span> Questions</h2>
              <p>
                Email <a href="mailto:support@seeyouyou.app" style={{ color: 'var(--brand-violet-deep)', fontWeight: 600 }}>support@seeyouyou.app</a>. We respond within one month of receiving your request, in accordance with GDPR Article 12.
              </p>
            </section>

          </div>
        </article>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<AccountDeletionPage />);
</script>

</body>
</html>
