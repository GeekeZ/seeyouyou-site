<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

<link rel="stylesheet" href="../tokens.css?v=s62"/>
<link rel="stylesheet" href="../styles.css?v=s62"/>

<style>
  html, body {
    background: radial-gradient(ellipse at top, #0a1130 0%, #02050f 70%);
    min-height: 100%;
    color: #E0D4FC;
  }
  body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 20% 10%, rgba(59, 130, 246, 0.22), transparent 55%),
      radial-gradient(circle at 80% 90%, rgba(124, 58, 237, 0.18), transparent 55%);
    z-index: 1;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="../terms-modal.jsx?v=s62"></script>

<script type="text/babel">
  function TermsPage() {
    return (
      <div className="policy-page">
        <div className="policy-topbar">
          <a href="../" className="policy-back" aria-label="Back to SeeYouYou homepage">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M15 18l-6-6 6-6"/>
            </svg>
            <span>Back to SeeYouYou</span>
          </a>
          <span className="policy-brand">
            <span className="policy-brand-dot"></span>
            SeeYouYou
          </span>
        </div>
        <article className="policy-card terms">
          <header className="privacy-modal-head">
            <div className="privacy-modal-titlewrap">
              <div className="privacy-modal-eyebrow terms-eyebrow">
                <span className="pm-dot"/>
                <span>Terms of Service</span>
                <span className="pm-version">v{TERMS_DATA.version}</span>
              </div>
              <h1 className="privacy-modal-title">The agreement, in plain language</h1>
              <p className="privacy-modal-meta">
                Effective {TERMS_DATA.effective} · Provider: {TERMS_DATA.provider}
              </p>
            </div>
          </header>
          <TermsContent standalone={true} />
        </article>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<TermsPage />);
</script>

</body>
</html>
